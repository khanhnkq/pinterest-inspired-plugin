name: Build & Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    name: Deploy Container to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to Azure VM and Update Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            echo "==> Deploying Pinterest Inspiration MCP on Azure VM..."
            mkdir -p ~/pinterest-inspiration-mcp
            cd ~/pinterest-inspiration-mcp
            
            # Sync repo files
            git remote set-url origin https://github.com/khanhnkq/pinterest-inspired-plugin.git || true
            git fetch origin main
            git reset --hard origin/main
            
            # Setup environment file if not present
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Authenticate to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            
            # Pull pre-built image
            echo "==> Pulling pre-built image from GHCR..."
            docker pull ghcr.io/khanhnkq/pinterest-inspired-plugin:latest
            
            # Launch container
            echo "==> Starting container with docker compose..."
            docker compose up -d --force-recreate
            
            # Verify status
            sleep 2
            docker ps --filter "name=pinterest-inspiration-mcp"
            echo "==> Deployment completed successfully on Azure VM!"
