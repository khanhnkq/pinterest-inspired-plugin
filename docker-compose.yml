services:
  pinterest-mcp:
    image: ghcr.io/khanhnkq/pinterest-inspired-plugin:latest
    container_name: pinterest-inspiration-mcp
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-127.0.0.1:8085}:8085"
    env_file:
      - path: .env
        required: false
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8085}
      - PINTEREST_CACHE_DIR=${PINTEREST_CACHE_DIR:-/app/.pinterest_cache}
    volumes:
      - pinterest_cache:/app/.pinterest_cache

volumes:
  pinterest_cache:
