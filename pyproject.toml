[project]
name = "pinterest-inspired-plugin"
version = "0.1.0"
description = "Pinterest visual inspiration MCP server and cross-agent plugin"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.2.0,<2",
    "pillow>=12.3.0",
]

[project.scripts]
pinterest-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

